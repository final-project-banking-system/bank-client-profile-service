databaseChangeLog:
  - changeSet:
      id: 002-create-addresses
      author: kirill25
      changes:
        - createTable:
            tableName: addresses
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: profile_id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: type
                  type: varchar(50)
                  constraints:
                    nullable: false

              - column:
                  name: country
                  type: varchar(100)
                  constraints:
                    nullable: false

              - column:
                  name: city
                  type: varchar(100)
                  constraints:
                    nullable: false

              - column:
                  name: street
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: postal_code
                  type: varchar(20)

              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: version
                  type: bigint
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: addresses
            baseColumnNames: profile_id
            referencedTableName: client_profiles
            referencedColumnNames: id
            constraintName: fk_addresses_profiles
            onDelete: CASCADE